<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Agendar horário | Dayane Cunha Nails</title>
  <link rel="icon" href="/assets/img/favicon-256.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/agendaflow-one.css">
</head>
<body data-page="booking">
  <div class="preview-ribbon">Prévia • AgendaFlow One</div>
  <main class="booking-shell">
    <aside class="booking-visual">
      <img src="/assets/img/herodayane.webp" alt="Trabalho Dayane Cunha Nails">
      <div class="booking-visual-content">
        <span class="af-tag">Dayane Cunha Nails</span>
        <h2>Seu momento de cuidado começa aqui.</h2>
        <p>Escolha o serviço, encontre um horário disponível e confirme em poucos passos.</p>
      </div>
    </aside>

    <section class="booking-main">
      <header class="booking-top">
        <div class="brand-lockup">
          <img src="/assets/img/logodayane.webp" alt="Dayane Cunha Nails">
          <div class="brand-copy">
            <small>Agendamento online</small>
            <strong>Dayane Cunha Nails</strong>
          </div>
        </div>
        <div class="booking-help">Borba Gato • Sabará/MG</div>
      </header>

      <div class="stepper" aria-label="Progresso do agendamento">
        <span class="step active"></span><span class="step"></span><span class="step"></span><span class="step"></span>
      </div>

      <div id="booking-step"></div>
      <div class="powered">Tecnologia <strong>AgendaFlow One</strong> • Prévia funcional</div>
    </section>
  </main>
  <script src="/assets/js/agendaflow-one.js"></script>
</body>
</html>
